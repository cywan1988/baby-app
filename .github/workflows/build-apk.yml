name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js README.md www/ 2>/dev/null || true
          cp icon-180.png icon-192.png icon-512.png icon-maskable-512.png www/ 2>/dev/null || true
      - name: Build native bridge (TTS)
        run: npx esbuild bridge.ts --bundle --format=iife --outfile=www/native-bridge.js
      - run: npx cap add android
      - run: npx cap sync android
      - name: Grant camera/mic & allow HTTP
        run: |
          python3 - <<'PYEOF'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          if "RECORD_AUDIO" not in s:
              tag = '<uses-permission android:name="android.permission.%s" />'
              perms = "".join(chr(10) + "    " + (tag % n) for n in ["CAMERA", "RECORD_AUDIO", "MODIFY_AUDIO_SETTINGS"])
              s = re.sub(r"(<manifest[^>]*>)", lambda m: m.group(1) + perms, s, count=1)
          if "usesCleartextTraffic" not in s:
              s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          open(p, "w", encoding="utf-8").write(s)
          print("patched OK")
          PYEOF
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baby-ai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
